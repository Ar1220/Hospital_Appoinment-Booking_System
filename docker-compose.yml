services:
  mysql:
    image: mysql:8.0
    container_name: requiem-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: requiem_root_2025
      MYSQL_DATABASE: requiem_hospital
    ports:
      # Host 3307 -> container 3306 (host 3306 is used by another project's MySQL)
      - "3307:3306"
    volumes:
      - requiem_mysql_data:/var/lib/mysql
      # Auto-loads the schema on first boot of an empty data dir
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prequiem_root_2025"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  requiem_mysql_data:
